<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" width="720" height="384" role="img" aria-label="Terminal session. whoami: full-stack and DevOps engineer. Stack: Next.js, TypeScript, React, Java, Spring Boot, PostgreSQL, Docker, GitHub Actions, Cloudflare. Now: Disscount.me, double gold at INOVA.">
<title>OffCrazyFreak terminal intro</title>
<style>
svg{--bg:#0a0e17;--panel:#111827;--line:#1f2a3d;--text:#e6edf3;--muted:#8b98a9;--a:#3ee6c4;--b:#8b5cf6;--glow-a:.34;--glow-b:.30;--dots:.16}
@font-face{font-family:'OCMono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'OCMono';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'OCMono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-weight:400}
.typer{transform:translateX(var(--dist));animation-name:type;animation-timing-function:steps(var(--n),end);animation-fill-mode:backwards}
.cur{opacity:0;animation-name:life;animation-timing-function:step-end}
.o{animation:show .5s ease backwards}
.blink{animation:blink 1.05s steps(1) 6.3s infinite}
.dot{animation:pulse 2.4s ease-in-out infinite}
@keyframes type{from{transform:translateX(0)}}
@keyframes life{from,to{opacity:1}}
@keyframes show{from{opacity:0;transform:translateX(-6px)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="719" height="383" rx="14" style="fill:var(--panel);stroke:var(--line)"/>
<path d="M.5 44H719.5" style="stroke:var(--line)"/>
<g aria-hidden="true"><circle cx="28" cy="22" r="6" fill="#ff5f56"/><circle cx="50" cy="22" r="6" fill="#ffbd2e"/><circle cx="72" cy="22" r="6" fill="#27c93f"/>
<text x="360" y="27" font-size="15" text-anchor="middle" style="fill:var(--muted)">jakov ~ fish</text>
<circle class="dot" cx="694" cy="22" r="5" style="fill:var(--a)"/></g>
<text x="36" y="112" font-size="22"><tspan style="fill:var(--a)">$ </tspan><tspan style="fill:var(--text)">whoami</tspan></text><g class="typer" style="--dist:109.6px;--n:8;animation-duration:0.60s;animation-delay:0.50s"><rect x="36" y="91" width="109.6" height="30" style="fill:var(--panel)"/><rect class="cur" x="36" y="93" width="11" height="25" style="fill:var(--a);animation-duration:0.60s;animation-delay:0.50s"/></g>
<text class="o" x="36" y="146" font-size="22" style="fill:var(--text);animation-delay:1.60s">full-stack + devops engineer</text>
<text x="36" y="180" font-size="22"><tspan style="fill:var(--a)">$ </tspan><tspan style="fill:var(--text)">cat stack.txt</tspan></text><g class="typer" style="--dist:202.0px;--n:15;animation-duration:1.12s;animation-delay:2.20s"><rect x="36" y="159" width="202.0" height="30" style="fill:var(--panel)"/><rect class="cur" x="36" y="161" width="11" height="25" style="fill:var(--a);animation-duration:1.12s;animation-delay:2.20s"/></g>
<text class="o" x="36" y="214" font-size="22" style="fill:var(--muted);animation-delay:3.50s">next.js typescript react java spring-boot</text>
<text class="o" x="36" y="248" font-size="22" style="fill:var(--muted);animation-delay:3.75s">postgresql docker gh-actions cloudflare</text>
<text x="36" y="282" font-size="22"><tspan style="fill:var(--a)">$ </tspan><tspan style="fill:var(--text)">./now</tspan></text><g class="typer" style="--dist:96.4px;--n:7;animation-duration:0.53s;animation-delay:4.50s"><rect x="36" y="261" width="96.4" height="30" style="fill:var(--panel)"/><rect class="cur" x="36" y="263" width="11" height="25" style="fill:var(--a);animation-duration:0.53s;animation-delay:4.50s"/></g>
<text class="o" x="36" y="316" font-size="22" style="fill:var(--b);animation-delay:5.30s">disscount.me * INOVA double gold</text>
<g class="o" style="animation-delay:5.8s"><text x="36" y="350" font-size="22" style="fill:var(--a)">$ </text><rect class="blink" x="62.4" y="331" width="11" height="25" style="fill:var(--a)"/></g>
</svg>
