<svg xmlns="http://www.w3.org/2000/svg" width="480" height="244" viewBox="0 0 480 244" role="img" aria-label="Creative Cluster: A map of creative organisations. Two public sites share one React codebase, each with its own database and language order.">
  <title>Creative Cluster: A map of creative organisations. Two public sites share one React codebase, each with its own database and language order.</title>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="479" height="243" rx="14" fill="#f9f9f9" stroke="#dfdfdf" stroke-width="1"/>
  <clipPath id="card"><rect x="0.5" y="0.5" width="479" height="243" rx="14"/></clipPath>
  <rect x="0" y="239" width="480" height="5" fill="#2ec50d" opacity="0.55" clip-path="url(#card)"/>
  
  <text x="24" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" fill="#1c7831">GIS PLATFORM / UR INSTITUTE</text>
  <text x="24" y="80" font-size="26" font-weight="700" letter-spacing="-0.4" fill="#222222">Creative Cluster</text>
  <text x="456" y="80" font-size="40" font-weight="800" text-anchor="end" fill="#1c7831">2</text>
  <text x="456" y="100" font-size="12.5" text-anchor="end" fill="#5d5d5d">sites, one codebase</text>
  <text x="24" y="126" font-size="14.5" fill="#5d5d5d">A map of creative organisations. Two public sites</text>
  <text x="24" y="147" font-size="14.5" fill="#5d5d5d">share one React codebase, each with its own database</text>
  <text x="24" y="168" font-size="14.5" fill="#5d5d5d">and language order.</text>
  
  <text x="24" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#5d5d5d">TanStack Start · PostgreSQL · Drizzle</text>
  </g>
</svg>
