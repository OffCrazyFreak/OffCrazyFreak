<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="Jakov Jakovac, full-stack and DevOps engineer">
<title>Jakov Jakovac, full-stack and DevOps engineer</title>
<style>
svg{--bg:#f6f8fa;--panel:#ffffff;--line:#d0d7de;--text:#0f172a;--muted:#57606a;--a:#0a8f7a;--b:#6d28d9;--glow-a:.20;--glow-b:.16;--dots:.22}
@font-face{font-family:'OCMono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'OCMono';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'OCMono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.mono{font-weight:400}
.hl{font-weight:700}
.drift{animation:drift 14s ease-in-out infinite alternate}
.drift2{animation:drift 18s ease-in-out infinite alternate-reverse}
.grid{animation:grid 5s linear infinite}
.sweep{animation:sweep 9s linear 1.5s infinite}
.rise{animation:rise .9s cubic-bezier(.16,1,.3,1) .15s backwards}
.fade{animation:fade .8s ease .1s backwards}
.ch{animation:ch .01s linear backwards}
.shine{animation:shine 7s ease-in-out 2.4s infinite}
.bob1{animation:bob 5s ease-in-out infinite alternate}
.bob2{animation:bob 5s ease-in-out -1.7s infinite alternate}
.bob3{animation:bob 5s ease-in-out -3.4s infinite alternate}
.flow{stroke-dasharray:4 10;animation:flow 1.4s linear infinite}
.caret{fill-opacity:0;animation:cursor 1.05s steps(1) 2.4s infinite}
.stackline{opacity:0;font-size:22px;font-weight:400;fill:var(--muted)}
.stackline.l1{opacity:1;animation:cyc 12s ease-in-out infinite}
.stackline.l2{animation:cyc 12s ease-in-out -8s infinite}
.stackline.l3{animation:cyc 12s ease-in-out -4s infinite}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-70px,34px)}}
@keyframes grid{from{transform:translateX(-24px)}to{transform:translateX(0)}}
@keyframes sweep{from{transform:translateX(-260px) skewX(-18deg)}to{transform:translateX(1200px) skewX(-18deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fade{from{opacity:0}}
@keyframes ch{from{fill-opacity:0}}
@keyframes shine{0%{transform:translateX(-120px) skewX(-20deg)}35%,100%{transform:translateX(760px) skewX(-20deg)}}
@keyframes bob{from{transform:translateY(-7px)}to{transform:translateY(7px)}}
@keyframes flow{from{stroke-dashoffset:28}to{stroke-dashoffset:0}}
@keyframes cursor{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}
@keyframes cyc{0%,3%{opacity:0}8%,30%{opacity:1}35%,100%{opacity:0}}
*{animation:none!important}
</style>
<defs>
<clipPath id="card"><rect width="960" height="340" rx="20"/></clipPath>
<radialGradient id="ga"><stop offset="0" style="stop-color:var(--a)"/><stop offset="1" style="stop-color:var(--a)" stop-opacity="0"/></radialGradient>
<radialGradient id="gb"><stop offset="0" style="stop-color:var(--b)"/><stop offset="1" style="stop-color:var(--b)" stop-opacity="0"/></radialGradient>
<linearGradient id="txt" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:var(--text)"/><stop offset=".55" style="stop-color:var(--text)"/><stop offset="1" style="stop-color:var(--a)"/></linearGradient>
<linearGradient id="band" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="beam" x1="0" x2="1"><stop offset="0" style="stop-color:var(--a)" stop-opacity="0"/><stop offset=".5" style="stop-color:var(--a)" stop-opacity=".12"/><stop offset="1" style="stop-color:var(--a)" stop-opacity="0"/></linearGradient>
<linearGradient id="layer" x1="0" x2="1" y1="0" y2="1"><stop offset="0" style="stop-color:var(--a)" stop-opacity=".30"/><stop offset="1" style="stop-color:var(--b)" stop-opacity=".30"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" style="fill:var(--a);opacity:var(--dots)"/></pattern>
<clipPath id="headclip"><text x="52" y="176" font-size="84" class="hl">Jakov Jakovac</text></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="960" height="340" style="fill:var(--bg)"/>
<g class="drift"><circle cx="800" cy="40" r="300" fill="url(#ga)" style="opacity:var(--glow-a)"/></g>
<g class="drift2"><circle cx="90" cy="380" r="320" fill="url(#gb)" style="opacity:var(--glow-b)"/></g>
<rect class="grid" x="-24" width="1008" height="340" fill="url(#dots)"/>
<rect class="sweep" x="0" y="0" width="220" height="340" fill="url(#beam)"/>
<rect x=".5" y=".5" width="959" height="339" rx="19.5" fill="none" style="stroke:var(--line)"/>

<g class="fade"><text x="56" y="84" font-size="24" class="mono" style="fill:var(--a)">$ whoami</text></g>
<g class="rise">
<text x="52" y="176" font-size="84" class="hl" fill="url(#txt)">Jakov Jakovac</text>
<g clip-path="url(#headclip)"><rect class="shine" x="0" y="90" width="90" height="110" fill="url(#band)"/></g>
</g>
<text x="56" y="232" font-size="32" class="mono" style="fill:var(--muted)"><tspan class="ch" style="animation-delay:1.00s">F</tspan><tspan class="ch" style="animation-delay:1.04s">u</tspan><tspan class="ch" style="animation-delay:1.09s">l</tspan><tspan class="ch" style="animation-delay:1.14s">l</tspan><tspan class="ch" style="animation-delay:1.18s">-</tspan><tspan class="ch" style="animation-delay:1.23s">s</tspan><tspan class="ch" style="animation-delay:1.27s">t</tspan><tspan class="ch" style="animation-delay:1.31s">a</tspan><tspan class="ch" style="animation-delay:1.36s">c</tspan><tspan class="ch" style="animation-delay:1.41s">k</tspan><tspan class="ch" style="animation-delay:1.45s"> </tspan><tspan class="ch" style="animation-delay:1.50s">&amp;</tspan><tspan class="ch" style="animation-delay:1.54s"> </tspan><tspan class="ch" style="animation-delay:1.58s">D</tspan><tspan class="ch" style="animation-delay:1.63s">e</tspan><tspan class="ch" style="animation-delay:1.67s">v</tspan><tspan class="ch" style="animation-delay:1.72s">O</tspan><tspan class="ch" style="animation-delay:1.77s">p</tspan><tspan class="ch" style="animation-delay:1.81s">s</tspan><tspan class="ch" style="animation-delay:1.85s"> </tspan><tspan class="ch" style="animation-delay:1.90s">e</tspan><tspan class="ch" style="animation-delay:1.94s">n</tspan><tspan class="ch" style="animation-delay:1.99s">g</tspan><tspan class="ch" style="animation-delay:2.04s">i</tspan><tspan class="ch" style="animation-delay:2.08s">n</tspan><tspan class="ch" style="animation-delay:2.12s">e</tspan><tspan class="ch" style="animation-delay:2.17s">e</tspan><tspan class="ch" style="animation-delay:2.21s">r</tspan><tspan class="caret" style="fill:var(--a)" font-weight="700"> _</tspan></text>
<text class="stackline l1" x="56" y="292">Next.js / TypeScript / Spring Boot / PostgreSQL</text><text class="stackline l2" x="56" y="292">Docker / GitHub Actions / Cloudflare / Linux</text><text class="stackline l3" x="56" y="292">Founder, Disscount.me / INOVA double gold</text>

<g aria-hidden="true" transform="translate(20,-48)">
<path class="flow" d="M810 100V290" fill="none" style="stroke:var(--a)" stroke-width="2" stroke-linecap="round" opacity=".8"/>
<g class="bob3"><path d="M810 236L905 276L810 316L715 276Z" fill="url(#layer)" style="stroke:var(--b)" stroke-width="1.5"/></g>
<g class="bob2"><path d="M810 178L905 218L810 258L715 218Z" fill="url(#layer)" style="stroke:var(--b)" stroke-width="1.5"/></g>
<g class="bob1"><path d="M810 120L905 160L810 200L715 160Z" fill="url(#layer)" style="stroke:var(--a)" stroke-width="1.5"/><circle cx="810" cy="160" r="5" style="fill:var(--a)"/></g>
</g>
</g>
</svg>
